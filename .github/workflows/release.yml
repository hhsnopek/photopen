# Release workflow - tag vX.Y.Z, get a signed APK on a GitHub release.
# Obtainium reads those releases; versionCode is derived from the tag so every
# release is strictly newer than the last.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout tag for workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch --tags origin
          git checkout ${{ inputs.tag }}

      # versionName comes from the tag; versionCode is MAJOR*10000 + MINOR*1000
      # + PATCH, so Obtainium always sees a strictly larger number.
      - name: Set version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | sed 's/-.*//')

          if [[ "$VERSION" == *"-beta."* ]]; then
            PATCH=$(echo "$VERSION" | grep -oP '(?<=-beta\.)\d+')
          elif [[ "$VERSION" == *"-rc."* ]]; then
            PATCH=$(echo "$VERSION" | grep -oP '(?<=-rc\.)\d+')
            PATCH=$((PATCH + 100))
          fi

          VERSION_CODE=$((MAJOR * 10000 + MINOR * 1000 + PATCH))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "Setting versionName=$VERSION, versionCode=$VERSION_CODE"
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          make version

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'photopen' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make release

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/photopen-${{ env.VERSION }}.apk

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            app/build/outputs/apk/release/photopen-${{ env.VERSION }}.apk
            app/build/outputs/apk/release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
